# AVISO: o serviço ATS na VPS foi desligado de propósito.
# A E.D.I.T.H. consome somente o pacote ats_core, em processo.
# Este workflow não dispara em push nem quando o CI termina com sucesso.
# O único gatilho é workflow_dispatch. Dispará-lo publica a stack na VPS de novo.
# O CI (pytest em push e pull request) continua em .github/workflows/ci.yml.

name: "AVISO: deploy manual na VPS (serviço desligado; sem automático)"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          AVISO: o serviço ATS na VPS foi desligado de propósito e a E.D.I.T.H.
          consome só a biblioteca ats_core. Este disparo manual publica a stack
          de novo. Não é o caminho operacional. SHA completo (40 hex) para
          deploy ou rollback; vazio usa o SHA desta execução.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-ai-token-suppressor
  cancel-in-progress: false

jobs:
  pytest:
    name: Testar ats_core antes do deploy manual
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolver SHA
        id: rev
        env:
          INPUT_REF: ${{ inputs.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REF="${INPUT_REF:-}"
          if [ -z "$REF" ]; then
            REF="$DISPATCH_SHA"
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "O ref precisa ser um SHA de 40 caracteres hexadecimais."
            exit 1
          fi
          echo "sha=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ steps.rev.outputs.sha }}

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar e rodar pytest
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "./packages/ats_core[test]"
          python -m pytest packages/ats_core/tests -q

  deploy:
    name: "AVISO: publicar na VPS (só disparo manual)"
    needs: pytest
    if: needs.pytest.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Aviso operacional
        run: |
          echo "AVISO: o serviço ATS na VPS foi desligado de propósito."
          echo "A E.D.I.T.H. consome ats_core como biblioteca. Este job só existe porque alguém disparou o workflow manualmente."

      - name: Resolver SHA
        id: rev
        env:
          INPUT_REF: ${{ inputs.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REF="${INPUT_REF:-}"
          if [ -z "$REF" ]; then
            REF="$DISPATCH_SHA"
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "O ref precisa ser um SHA de 40 caracteres hexadecimais."
            exit 1
          fi
          echo "sha=$REF" >> "$GITHUB_OUTPUT"

      - name: Publicar por SSH e exigir healthcheck
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ steps.rev.outputs.sha }}
        run: |
          set -euo pipefail
          cleanup() {
            rm -f "$HOME/.ssh/vps_deploy_key" "$HOME/.ssh/vps_known_hosts" /tmp/deploy_port
          }
          trap cleanup EXIT
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          host = os.environ.get("VPS_HOST", "").strip()
          user = os.environ.get("VPS_USER", "").strip()
          key = os.environ.get("VPS_SSH_KEY", "").replace("\\n", "\n").strip() + "\n"
          known = os.environ.get("VPS_KNOWN_HOSTS", "").replace("\\n", "\n").strip() + "\n"
          port = os.environ.get("VPS_PORT", "").strip() or "22"
          if not host or not user:
              sys.exit("VPS_HOST e VPS_USER são obrigatórios.")
          if "PRIVATE KEY" not in key:
              sys.exit("VPS_SSH_KEY não contém uma chave privada.")
          if not any(token in known for token in ("ssh-ed25519", "ssh-rsa", "ecdsa-sha2-", "sk-ssh-")):
              sys.exit("VPS_KNOWN_HOSTS não contém uma host key.")
          if not port.isdigit() or int(port) < 1 or int(port) > 65535:
              sys.exit("VPS_PORT precisa ser numérico.")
          ssh_dir = Path.home() / ".ssh"
          ssh_dir.mkdir(mode=0o700, exist_ok=True)
          ssh_dir.chmod(0o700)
          key_path = ssh_dir / "vps_deploy_key"
          known_path = ssh_dir / "vps_known_hosts"
          key_path.write_text(key)
          known_path.write_text(known)
          key_path.chmod(0o600)
          known_path.chmod(0o600)
          Path("/tmp/deploy_port").write_text(port)
          PY
          PORT="$(cat /tmp/deploy_port)"
          ssh -p "$PORT" \
            -i "$HOME/.ssh/vps_deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/vps_known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- $DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          DEPLOY_SHA="${1:?sha ausente}"
          export GIT_TERMINAL_PROMPT=0
          cd /home/bruce/apps/AiTokenSuppressor
          if [ ! -f .env ]; then
            echo ".env de produção ausente."
            exit 1
          fi
          mode="$(stat -c %a .env)"
          if [ "$mode" != "600" ]; then
            echo ".env precisa estar com chmod 600 (modo atual: ${mode})."
            exit 1
          fi
          git -c safe.directory=/home/bruce/apps/AiTokenSuppressor fetch origin
          git -c safe.directory=/home/bruce/apps/AiTokenSuppressor reset --hard "$DEPLOY_SHA"
          export GIT_SHA="$DEPLOY_SHA"
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
          if ! command -v curl >/dev/null 2>&1; then
            echo "curl ausente na VPS."
            exit 1
          fi
          deadline=$((SECONDS + 240))
          ready=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            ids="$(docker compose -f docker-compose.prod.yml ps -q)"
            if [ -z "$ids" ]; then
              sleep 5
              continue
            fi
            pending=0
            for id in $ids; do
              running="$(docker inspect -f '{{.State.Status}}' "$id")"
              health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$id")"
              if [ "$running" = "exited" ] || [ "$running" = "dead" ] || [ "$health" = "unhealthy" ] || [ "$health" = "none" ]; then
                echo "Container ${id} em estado ${running}/${health}."
                docker compose -f docker-compose.prod.yml ps || true
                docker compose -f docker-compose.prod.yml logs --tail=60 --no-log-prefix || true
                exit 1
              fi
              if [ "$running" != "running" ] || [ "$health" != "healthy" ]; then
                pending=1
              fi
            done
            if [ "$pending" -eq 0 ]; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "Healthcheck não ficou saudável a tempo."
            docker compose -f docker-compose.prod.yml ps || true
            docker compose -f docker-compose.prod.yml logs --tail=60 --no-log-prefix || true
            exit 1
          fi
          curl -fsS --max-time 10 http://127.0.0.1:8105/health >/dev/null
          curl -fsS --max-time 10 http://127.0.0.1:8100/health/live >/dev/null
          for id in $(docker compose -f docker-compose.prod.yml ps -q); do
            ips="$(docker inspect -f '{{range $p, $conf := .HostConfig.PortBindings}}{{range $conf}}{{.HostIp}}{{"\n"}}{{end}}{{end}}' "$id")"
            while IFS= read -r ip; do
              [ -z "$ip" ] && continue
              if [ "$ip" != "127.0.0.1" ]; then
                echo "Porta publicada fora do loopback."
                exit 1
              fi
            done <<< "$ips"
          done
          echo "Deploy saudável em 127.0.0.1."
          REMOTE
