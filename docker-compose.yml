services:

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      API_KEY: ${API_KEY}
      ROOT_PATH: ${ROOT_PATH:-/api}
      PROXY_DEFAULT_STRATEGY: ${PROXY_DEFAULT_STRATEGY:-balanced}
      PROXY_PIPELINE: ${PROXY_PIPELINE:-compress}
      PROXY_USE_MEMORY: ${PROXY_USE_MEMORY:-false}
      PROXY_USE_OLLAMA: ${PROXY_USE_OLLAMA:-false}
      PROXY_SKIP_OPTIMIZE: ${PROXY_SKIP_OPTIMIZE:-false}
      PROXY_PROVIDER_FALLBACK: ${PROXY_PROVIDER_FALLBACK:-groq,openai,anthropic,gemini,deepseek,ollama}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "8105:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ats-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats-celery-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
    networks:
      - ats-network

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats-flower
    command: celery -A app.workers.celery_app flower --port=5556
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://host.docker.internal:6379/1
      CELERY_RESULT_BACKEND: redis://host.docker.internal:6379/2
    ports:
      - "8104:5556"  # <--- Nova porta do Flower (Antiga: 5556)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - celery-worker
    networks:
      - ats-network

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ats-litellm
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4001"]
    ports:
      - "8101:4001"  # <--- Nova porta do LiteLLM (Antiga: 4001)
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      OLLAMA_API_BASE: http://host.docker.internal:11999
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ats-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_API_KEY: ${VITE_API_KEY:-${API_KEY:-ats-dev-api-key-change-in-production}}
        VITE_API_DIRECT_URL: ${VITE_API_DIRECT_URL:-}
    container_name: ats-frontend
    restart: unless-stopped
    ports:
      - "8100:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ats-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ats-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "8102:9090"  # <--- Nova porta do Prometheus (Antiga: 9091)
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - ats-network

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ats-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "8103:3000"  # <--- Nova porta do Grafana (Antiga: 3001)
    depends_on:
      - prometheus
    networks:
      - ats-network

volumes:
  prometheus_data:
  grafana_data:

networks:
  ats-network:
    driver: bridge