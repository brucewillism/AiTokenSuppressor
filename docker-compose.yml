services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ats-postgres
    environment:
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats_secret
      POSTGRES_DB: ai_token_suppressor
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats -d ai_token_suppressor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats-network

  redis:
    image: redis:7-alpine
    container_name: ats-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats-network

  ollama:
    image: ollama/ollama:latest
    container_name: ats-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ats-network

  ollama-init:
    image: ollama/ollama:latest
    container_name: ats-ollama-init
    depends_on:
      ollama:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 10 &&
      ollama pull llama3.2:3b &&
      ollama pull nomic-embed-text
      "
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks:
      - ats-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ats:ats_secret@postgres:5432/ai_token_suppressor
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ats-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats-celery-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ats:ats_secret@postgres:5432/ai_token_suppressor
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - api
      - redis
      - postgres
    networks:
      - ats-network

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats-flower
    command: celery -A app.workers.celery_app flower --port=5555
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      - celery-worker
      - redis
    networks:
      - ats-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ats-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - ats-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ats-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - ats-network

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ats-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - ats-network

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  ats-network:
    driver: bridge
