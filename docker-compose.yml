services:

  redis:
    image: redis:7-alpine
    container_name: ats-redis
    restart: unless-stopped
    ports:
      - "8106:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 192M
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - ats-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      API_KEY: ${API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-${SECRET_KEY}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ROOT_PATH: ${ROOT_PATH:-/api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8100}
      PROXY_DEFAULT_STRATEGY: ${PROXY_DEFAULT_STRATEGY:-fast}
      PROXY_PIPELINE: ${PROXY_PIPELINE:-compress}
      PROXY_USE_MEMORY: ${PROXY_USE_MEMORY:-false}
      PROXY_USE_OLLAMA: ${PROXY_USE_OLLAMA:-false}
      PROXY_SKIP_OPTIMIZE: ${PROXY_SKIP_OPTIMIZE:-false}
      PROXY_PROVIDER_FALLBACK: ${PROXY_PROVIDER_FALLBACK:-groq,openai,anthropic,gemini,deepseek,ollama}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-3}
      LOW_MEMORY_MODE: ${LOW_MEMORY_MODE:-true}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-false}
      COMPRESS_AUTO_BALANCED_TOKENS: ${COMPRESS_AUTO_BALANCED_TOKENS:-800}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    deploy:
      resources:
        limits:
          memory: 768M
    ports:
      - "8105:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - ats-network

  celery-worker:
    profiles:
      - workers
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats-celery-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - redis
    networks:
      - ats-network

  flower:
    profiles:
      - workers
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats-flower
    command: celery -A app.workers.celery_app flower --port=5556
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    ports:
      - "8104:5556"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - celery-worker
      - redis
    networks:
      - ats-network

  litellm:
    profiles:
      - litellm
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ats-litellm
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4001"]
    ports:
      - "8101:4001"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      OLLAMA_API_BASE: http://host.docker.internal:11999
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ats-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_API_KEY: ${VITE_API_KEY:-${API_KEY:-ats-dev-api-key-change-in-production}}
        VITE_API_DIRECT_URL: ${VITE_API_DIRECT_URL:-}
    container_name: ats-frontend
    restart: unless-stopped
    ports:
      - "8100:80"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health/live"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ats-network

  prometheus:
    profiles:
      - monitoring
    image: prom/prometheus:v2.54.1
    container_name: ats-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "8102:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - ats-network

  grafana:
    profiles:
      - monitoring
    image: grafana/grafana:11.3.0
    container_name: ats-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "8103:3000"
    depends_on:
      - prometheus
    networks:
      - ats-network

volumes:
  prometheus_data:
  grafana_data:
  redis_data:

networks:
  ats-network:
    driver: bridge