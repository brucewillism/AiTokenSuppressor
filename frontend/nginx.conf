# AI Token Suppressor — reverse proxy (porta 8100 no host)
# Ordem: rotas da API (prefixo exato) → /api e /v1 → SPA React por último.

upstream ats_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # --- API FastAPI (sem auth no health) ---

    location = /health {
        proxy_pass http://ats_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location ^~ /health/ {
        proxy_pass http://ats_api/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /metrics {
        proxy_pass http://ats_api/metrics;
        proxy_set_header Host $host;
    }

    # OpenAI-compatible: /v1/chat/completions, /v1/models
    location /v1/ {
        proxy_pass http://ats_api/v1/;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_buffering off;
    }

    # API nativa: /api/compress → backend /compress
    location /api/ {
        proxy_pass http://ats_api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
    }

    # Swagger/OpenAPI na raiz (alguns clientes pedem /openapi.json)
    location = /openapi.json {
        proxy_pass http://ats_api/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    # --- Frontend React/Vite (sempre por último) ---

    location / {
        try_files $uri $uri/ /index.html;
    }
}
